name: Deploy to Bluehost VPS

on:
  push:
    branches:
      - main  # Trigger workflow on pushing to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://rilwhmaeyqkrjxovtyaa.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpbHdobWFleXFrcmp4b3Z0eWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTU3NTMsImV4cCI6MjA5NDY3MTc1M30.rsN_B3ZmknRXzI0JgtGV5pLZU2r2IKMrX1psiiEibGg' }}
          VITE_AI_SUPPORT_API_URL: ${{ secrets.VITE_AI_SUPPORT_API_URL }}
        run: npm run build

      - name: Build loading-ai sub-project
        run: |
          cd loading-ai
          npm ci || npm install
          npm run build
          cd ..
          mkdir -p dist/loading-ai
          cp -r loading-ai/dist/* dist/loading-ai/

      - name: Tar release assets
        run: tar -czf release.tar.gz -C dist .

      - name: Tar AI server runtime
        run: tar -czf server-release.tar.gz server package.json package-lock.json

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy and Extract via SSH/SCP (Non-rsync)
        run: |
          # Add the VPS host to known_hosts to prevent interactive confirmation prompt
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts
          
          # Create target directory if it doesn't exist
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "mkdir -p ${{ secrets.VPS_TARGET_DIR }}"
          
          # Upload the tarball
          scp release.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:${{ secrets.VPS_TARGET_DIR }}/
          scp server-release.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:${{ secrets.VPS_TARGET_DIR }}/
          
          # Clean up previous web assets on VPS to prevent bloat, then extract and clean tarball.
          #
          # Some VPS/Nginx installs point the live HTTPS vhost at a directory
          # that is different from VPS_TARGET_DIR. Deploy to the configured
          # target first, then also update any existing Crafton static roots
          # discovered under common web directories.
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} '
            release="${{ secrets.VPS_TARGET_DIR }}/release.tar.gz"
            source_release="$(mktemp)"
            cp "$release" "$source_release"
            targets="${{ secrets.VPS_TARGET_DIR }}"

            index_list="$(mktemp)"
            for base in /var/www /home /usr/share/nginx/html /usr/local/nginx/html /www /srv /opt /root; do
              [ -d "$base" ] || continue
              find "$base" -maxdepth 7 -type f -name index.html 2>/dev/null >> "$index_list" || true
            done

            while IFS= read -r index_file; do
              [ -n "$index_file" ] || continue
              [ -f "$index_file" ] || continue
              dir="$(dirname "$index_file")"
              asset="$(grep -o "assets/index-[^\"[:space:]]*\.js" "$index_file" 2>/dev/null | head -n 1 || true)"
              if [ -n "$asset" ] && { grep -qi "crafton" "$index_file" 2>/dev/null || grep -qi "crafton" "$dir/$asset" 2>/dev/null; }; then
                case " $targets " in
                  *" $dir "*) ;;
                  *) targets="$targets $dir" ;;
                esac
              fi
            done < "$index_list"
            rm -f "$index_list"

            for dir in $targets; do
              mkdir -p "$dir"
              if [ ! -w "$dir" ]; then
                echo "Skipping non-writable static root: $dir"
                continue
              fi
              cp "$source_release" "$dir/release.tar.gz" || {
                echo "Skipping static root after copy failure: $dir"
                continue
              }
              (
                cd "$dir" &&
                  rm -rf assets loading-ai index.html furniture_scan.mp4 hero_chair.jpg &&
                  tar -xzf release.tar.gz &&
                  rm release.tar.gz &&
                  echo "Deployed Crafton static bundle to: $dir"
              ) || echo "Static root deploy failed but continuing: $dir"
            done
            rm -f "$source_release" "$release"
          '

      - name: Deploy and restart Crafton AI API
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} '
            set -eu
            archive="${{ secrets.VPS_TARGET_DIR }}/server-release.tar.gz"
            runtime="${{ secrets.VPS_TARGET_DIR }}/server-runtime"
            old_env=""

            existing_server="$(
              for base in /var/www /home /usr/share/nginx/html /www /srv /opt /root; do
                [ -d "$base" ] || continue
                find "$base" -maxdepth 9 -type f -path "*/server/ai-support-server.mjs" -readable 2>/dev/null || true
              done | while IFS= read -r candidate; do
                candidate_root="$(dirname "$(dirname "$candidate")")"
                if [ -r "$candidate_root/server/.env" ] && grep -q "^DEEPSEEK_API_KEY=" "$candidate_root/server/.env"; then
                  echo "$candidate_root"
                  break
                fi
              done
            )"

            if [ -n "$existing_server" ] && [ -w "$existing_server" ]; then
              runtime="$existing_server"
              old_env="$existing_server/server/.env"
            fi

            mkdir -p "$runtime"
            tar -xzf "$archive" -C "$runtime"
            rm -f "$archive"
            cd "$runtime"
            if [ ! -f server/.env ] && [ -n "$old_env" ]; then
              cp "$old_env" server/.env
            fi
            npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts

            if [ ! -f server/.env ]; then
              echo "No server/.env found in $runtime; keeping the existing AI process unchanged."
              exit 1
            fi

            port_pid=""
            if command -v fuser >/dev/null 2>&1; then
              port_pid="$(fuser 8787/tcp 2>/dev/null | tr " " "\n" | grep -E "^[0-9]+$" | head -n 1 || true)"
            elif command -v lsof >/dev/null 2>&1; then
              port_pid="$(lsof -t -iTCP:8787 -sTCP:LISTEN 2>/dev/null | head -n 1 || true)"
            fi
            if [ -n "$port_pid" ]; then kill "$port_pid" 2>/dev/null || true; sleep 3; fi

            if ! curl --fail --silent http://127.0.0.1:8787/health >/dev/null 2>&1; then
              mkdir -p server/logs
              nohup node --env-file-if-exists=server/.env server/ai-support-server.mjs > server/logs/ai-support-runtime.log 2>&1 < /dev/null &
              sleep 3
            fi

            curl --fail --silent --show-error http://127.0.0.1:8787/health
            probe_code="$(curl --silent --output /tmp/crafton-rfq-probe.json --write-out "%{http_code}" -X POST -H "Content-Type: application/json" -d "{\"action\":\"generate_rfq\"}" http://127.0.0.1:8787/api/ai-support-chat)"
            rm -f /tmp/crafton-rfq-probe.json
            if [ "$probe_code" != "401" ]; then
              echo "RFQ API version probe failed with HTTP $probe_code"
              exit 1
            fi
          '
