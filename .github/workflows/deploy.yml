name: Deploy to Bluehost VPS

on:
  push:
    branches:
      - main  # Trigger workflow on pushing to the main branch

concurrency:
  group: crafton-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Verify project editing and service copy
        run: |
          npm run test:project-editing
          node --test src/customerServiceCopy.test.mjs server/lib/aiSupportAgent.test.mjs server/lib/technicalDrawing.test.mjs server/lib/projectLifecycle.test.mjs server/lib/rfqSourceData.test.mjs

      - name: Build project
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL || 'https://rilwhmaeyqkrjxovtyaa.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpbHdobWFleXFrcmp4b3Z0eWFhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwOTU3NTMsImV4cCI6MjA5NDY3MTc1M30.rsN_B3ZmknRXzI0JgtGV5pLZU2r2IKMrX1psiiEibGg' }}
          VITE_AI_SUPPORT_API_URL: ${{ secrets.VITE_AI_SUPPORT_API_URL }}
        run: npm run build

      - name: Build loading-ai sub-project
        run: |
          cd loading-ai
          npm ci || npm install
          npm run build
          cd ..
          mkdir -p dist/loading-ai
          cp -r loading-ai/dist/* dist/loading-ai/

      - name: Tar release assets
        run: tar -czf release.tar.gz -C dist .

      - name: Tar AI server runtime
        run: tar -czf server-release.tar.gz server shared package.json package-lock.json

      - name: Set up SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Upload release archives
        run: |
          # Add the VPS host to known_hosts to prevent interactive confirmation prompt
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H ${{ secrets.VPS_IP }} >> ~/.ssh/known_hosts
          
          # Create target directory if it doesn't exist
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} "mkdir -p ${{ secrets.VPS_TARGET_DIR }}"
          
          # Upload the tarball
          scp release.tar.gz ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:${{ secrets.VPS_TARGET_DIR }}/
          scp server-release.tar.gz scripts/check-project-edit-schema.mjs ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}:${{ secrets.VPS_TARGET_DIR }}/
          
      - name: Deploy and restart Crafton AI API
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} '
            set -eu
            archive="${{ secrets.VPS_TARGET_DIR }}/server-release.tar.gz"
            runtime="${{ secrets.VPS_TARGET_DIR }}/server-runtime"
            old_env=""
            port_pid=""

            listener_pid() {
              if command -v lsof >/dev/null 2>&1; then
                lsof -t -iTCP:8787 -sTCP:LISTEN 2>/dev/null | head -n 1 || true
              elif command -v fuser >/dev/null 2>&1; then
                fuser 8787/tcp 2>/dev/null | tr " " "\n" | grep -E "^[0-9]+$" | head -n 1 || true
              elif command -v ss >/dev/null 2>&1; then
                ss -ltnp "sport = :8787" 2>/dev/null | sed -n "s/.*pid=\([0-9][0-9]*\).*/\1/p" | head -n 1 || true
              fi
            }

            port_pid="$(listener_pid)"
            if [ -z "$port_pid" ]; then
              port_pid="$(ps -eo pid=,args= | awk "/[a]i-support-server[.]mjs/ { print \$1; exit }" || true)"
            fi

            echo "Available process tools: lsof=$(command -v lsof || true) fuser=$(command -v fuser || true) ss=$(command -v ss || true)"
            echo "Crafton AI process candidates:"
            ps -eo pid=,ppid=,user=,args= | awk "/[a]i-support-server[.]mjs/ { print }" || true

            if [ -n "$port_pid" ]; then
              live_cwd="$(readlink -f "/proc/$port_pid/cwd" 2>/dev/null || true)"
              live_exe="$(readlink -f "/proc/$port_pid/exe" 2>/dev/null || true)"
              live_command="$(tr "\000" " " < "/proc/$port_pid/cmdline" 2>/dev/null || true)"
              live_script="$(tr "\000" "\n" < "/proc/$port_pid/cmdline" 2>/dev/null | grep "ai-support-server.mjs$" | head -n 1 || true)"

              echo "Crafton API listener PID: $port_pid"
              echo "Crafton API executable: $live_exe"
              echo "Crafton API working directory: $live_cwd"
              echo "Crafton API command: $live_command"
              echo "Crafton API cgroup:"
              cat "/proc/$port_pid/cgroup" 2>/dev/null || true
              ps -o pid=,ppid=,user=,args= -p "$port_pid" 2>/dev/null || true

              if [ -n "$live_script" ]; then
                case "$live_script" in
                  /*) resolved_script="$live_script" ;;
                  *) resolved_script="$live_cwd/$live_script" ;;
                esac
                resolved_script="$(readlink -f "$resolved_script" 2>/dev/null || true)"
                live_root="$(dirname "$(dirname "$resolved_script")")"
                if [ -n "$resolved_script" ] && [ -r "$live_root/server/.env" ] && [ -w "$live_root" ]; then
                  runtime="$live_root"
                  old_env="$live_root/server/.env"
                  echo "Resolved live API source root from process command: $runtime"
                fi
              fi
            else
              echo "No existing listener found on port 8787."
            fi

            existing_server="$(
              for base in /var/www /home /usr/share/nginx/html /www /srv /opt /root; do
                [ -d "$base" ] || continue
                find "$base" -maxdepth 9 -type f -path "*/server/ai-support-server.mjs" -readable 2>/dev/null || true
              done | while IFS= read -r candidate; do
                candidate_root="$(dirname "$(dirname "$candidate")")"
                if [ -r "$candidate_root/server/.env" ] && grep -q "^DEEPSEEK_API_KEY=" "$candidate_root/server/.env"; then
                  echo "$candidate_root"
                  break
                fi
              done
            )"

            if [ -z "$old_env" ] && [ -n "$existing_server" ] && [ -w "$existing_server" ]; then
              runtime="$existing_server"
              old_env="$existing_server/server/.env"
              echo "Using discovered API source root: $runtime"
            fi

            if [ -z "$old_env" ] && [ -n "$port_pid" ]; then
              if [ -r "$live_cwd/server/.env" ] && [ -w "$live_cwd" ]; then
                runtime="$live_cwd"
                old_env="$live_cwd/server/.env"
              elif [ -r "$live_cwd/.env" ] && [ "$(basename "$live_cwd")" = "server" ]; then
                live_root="$(dirname "$live_cwd")"
                if [ -w "$live_root" ]; then
                  runtime="$live_root"
                  old_env="$live_cwd/.env"
                fi
              fi
            fi

            # Stop the known systemd workers before enabling staged imports.
            # Do not publish the frontend until the new API and workers pass probes.
            test -r "$old_env"
            test "$(id -u)" = "0"
            systemctl stop crafton-intake-worker.service crafton-technical-drawing-worker.service
            if pgrep -f "^.*node .*server/(intake-worker|technical-drawing-worker)[.]mjs" >/dev/null; then
              echo "An unmanaged worker is still running; aborting before migration."
              exit 1
            fi
            echo "CRAFTON_WORKERS_PAUSED_READY_FOR_MIGRATION"
            if ! node --env-file="$old_env" "${{ secrets.VPS_TARGET_DIR }}/check-project-edit-schema.mjs" --wait; then
              # No runtime or frontend changes have been made yet.
              systemctl start crafton-intake-worker.service crafton-technical-drawing-worker.service
              exit 1
            fi
            backup="/var/backups/crafton/${{ github.sha }}"
            install -d -m 700 "$backup"
            tar --exclude=server/logs --exclude=node_modules -czf "$backup/runtime-before.tar.gz" -C "$runtime" server package.json package-lock.json
            if [ -d "$runtime/shared" ]; then tar -czf "$backup/shared-before.tar.gz" -C "$runtime" shared; fi

            echo "Deploying Crafton AI runtime to: $runtime"

            mkdir -p "$runtime"
            tar -xzf "$archive" -C "$runtime"
            rm -f "$archive"
            cd "$runtime"
            if [ ! -f server/.env ] && [ -n "$old_env" ]; then
              cp "$old_env" server/.env
            fi
            npm ci --omit=dev --ignore-scripts || npm install --omit=dev --ignore-scripts

            if [ ! -f server/.env ]; then
              echo "No server/.env found in $runtime; keeping the existing AI process unchanged."
              exit 1
            fi

            upsert_env() {
              key="$1"
              value="$2"
              if grep -q "^${key}=" server/.env; then
                sed -i "s|^${key}=.*|${key}=${value}|" server/.env
              else
                printf "\n%s=%s\n" "$key" "$value" >> server/.env
              fi
            }

            # Whole-document Gemini intake needs a longer request window and
            # enough structured-output capacity. Keep these deployment-owned
            # runtime limits aligned with server/.env.example.
            upsert_env GEMINI_VISION_TIMEOUT_MS 180000
            upsert_env GEMINI_INTAKE_MAX_OUTPUT_TOKENS 32768
            upsert_env INTAKE_GEMINI_PDF_INLINE_MAX_BYTES 50331648
            upsert_env INTAKE_OFFICE_CONVERSION_TIMEOUT_MS 90000

            if [ -n "$port_pid" ]; then
              kill "$port_pid" 2>/dev/null || true
              sleep 4
              restarted_pid="$(listener_pid)"
              if [ -n "$restarted_pid" ]; then
                restarted_cwd="$(readlink -f "/proc/$restarted_pid/cwd" 2>/dev/null || true)"
                restarted_command="$(tr "\000" " " < "/proc/$restarted_pid/cmdline" 2>/dev/null || true)"
                echo "Supervisor restarted listener as PID $restarted_pid"
                echo "Restarted API working directory: $restarted_cwd"
                echo "Restarted API command: $restarted_command"
              fi
            fi

            if ! curl --fail --silent http://127.0.0.1:8787/health >/dev/null 2>&1; then
              mkdir -p server/logs
              nohup node --env-file-if-exists=server/.env server/ai-support-server.mjs > server/logs/ai-support-runtime.log 2>&1 < /dev/null &
              sleep 3
            fi

            curl --fail --silent --show-error http://127.0.0.1:8787/health
            probe_code="$(curl --silent --output /tmp/crafton-rfq-probe.json --write-out "%{http_code}" -X POST -H "Content-Type: application/json" -d "{\"action\":\"client_project_edit\"}" http://127.0.0.1:8787/api/ai-support-chat)"
            rm -f /tmp/crafton-rfq-probe.json
            if [ "$probe_code" != "401" ]; then
              echo "Project editing API version probe failed with HTTP $probe_code"
              exit 1
            fi

            if [ "$(id -u)" = "0" ] && [ -f server/systemd/crafton-technical-drawing-worker.service ] && [ -f server/systemd/crafton-intake-worker.service ]; then
              node_binary="$(command -v node)"
              for worker in crafton-intake-worker crafton-technical-drawing-worker; do
                sed \
                  -e "s|^WorkingDirectory=.*|WorkingDirectory=$runtime|" \
                  -e "s|^ExecStart=/usr/bin/node |ExecStart=$node_binary |" \
                  "server/systemd/$worker.service" \
                  > "/etc/systemd/system/$worker.service"
              done
              systemctl daemon-reload
              systemctl enable --now crafton-intake-worker.service crafton-technical-drawing-worker.service
              systemctl restart crafton-intake-worker.service crafton-technical-drawing-worker.service
              sleep 5
              systemctl is-active --quiet crafton-intake-worker.service crafton-technical-drawing-worker.service
              systemctl --no-pager --full status crafton-intake-worker.service | head -n 12
              systemctl --no-pager --full status crafton-technical-drawing-worker.service | head -n 12
            else
              old_intake_pid="$(ps -eo pid=,args= | awk "/[i]ntake-worker[.]mjs/ { print \$1; exit }" || true)"
              if [ -n "$old_intake_pid" ]; then kill "$old_intake_pid" 2>/dev/null || true; fi
              old_drawing_pid="$(ps -eo pid=,args= | awk "/[t]echnical-drawing-worker[.]mjs/ { print \$1; exit }" || true)"
              if [ -n "$old_drawing_pid" ]; then kill "$old_drawing_pid" 2>/dev/null || true; fi
              mkdir -p server/logs
              nohup node --env-file-if-exists=server/.env server/intake-worker.mjs > server/logs/intake-worker.log 2>&1 < /dev/null &
              nohup node --env-file-if-exists=server/.env server/technical-drawing-worker.mjs > server/logs/technical-drawing-worker.log 2>&1 < /dev/null &
            fi
          '

      - name: Publish frontend after backend and database are ready
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }} 'bash -s' <<'REMOTE'
          set -euo pipefail
          release="${{ secrets.VPS_TARGET_DIR }}/release.tar.gz"
          backup="/var/backups/crafton/${{ github.sha }}"
          # These are the live roots confirmed by the previous successful release.
          # Never rediscover backup folders or nested loading-ai applications.
          declare -A published_roots=()
          for dir in "${{ secrets.VPS_TARGET_DIR }}" /var/www/crafton-ai /var/www/html; do
            test -d "$dir" && test -w "$dir"
            dir="$(readlink -f "$dir")"
            if [ -n "${published_roots[$dir]:-}" ]; then continue; fi
            published_roots[$dir]=1
            root_id="$(printf "%s" "$dir" | sha256sum | cut -c1-12)"
            if [ -f "$dir/index.html" ]; then
              tar -czf "$backup/frontend-$root_id.tar.gz" -C "$dir" index.html assets loading-ai
            fi
            # Retain old hashed assets for clients with a previously loaded page.
            # Publish the HTML entry points only after every asset has been copied.
            tar -xzf "$release" -C "$dir" --exclude=./index.html --exclude=./loading-ai/index.html
            tar -xOf "$release" ./loading-ai/index.html > "$dir/loading-ai/index.html.next"
            mv "$dir/loading-ai/index.html.next" "$dir/loading-ai/index.html"
            tar -xOf "$release" ./index.html > "$dir/index.html.next"
            mv "$dir/index.html.next" "$dir/index.html"
            printf "%s\n" "${{ github.sha }}" > "$dir/release-version.txt"
            echo "Published Crafton frontend: $dir"
          done
          rm -f "$release" "${{ secrets.VPS_TARGET_DIR }}/check-project-edit-schema.mjs"
          curl --fail --silent --show-error http://127.0.0.1:8787/health
          systemctl is-active crafton-intake-worker.service crafton-technical-drawing-worker.service
          REMOTE
