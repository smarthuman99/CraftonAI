name: Diagnose Crafton VPS routing

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Inspect static roots and HTTP routing
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p 22 -H "${{ secrets.VPS_IP }}" >> ~/.ssh/known_hosts
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_IP }}" '
            set -u
            echo "=== host ==="
            hostname
            date -u
            echo "=== listeners ==="
            ss -ltnp 2>/dev/null | head -n 40 || true
            echo "=== services ==="
            for service in nginx apache2 httpd caddy; do
              printf "%s: " "$service"
              systemctl is-active "$service" 2>/dev/null || true
            done
            echo "=== static roots ==="
            for dir in /var/www/crafton-ai /var/www/html; do
              echo "-- $dir"
              if [ -d "$dir" ]; then
                ls -la "$dir" | head -n 30
                grep -o "assets/index-[^\"[:space:]]*\.[jc][ss]" "$dir/index.html" 2>/dev/null || true
              else
                echo "missing"
              fi
            done
            echo "=== local HTTP probes ==="
            for host in 127.0.0.1 129.121.98.185 localhost; do
              echo "-- Host: $host"
              curl --silent --show-error --max-time 8 -H "Host: $host" -D - http://127.0.0.1/ -o /tmp/crafton-http-body.txt || true
              head -c 160 /tmp/crafton-http-body.txt 2>/dev/null || true
              echo
            done
            echo "=== direct nginx probes ==="
            for port in 8080 8443; do
              echo "-- port $port"
              if [ "$port" = "8443" ]; then
                curl --insecure --silent --show-error --max-time 8 -D - "https://127.0.0.1:$port/" -o /tmp/crafton-nginx-body.txt || true
              else
                curl --silent --show-error --max-time 8 -D - "http://127.0.0.1:$port/" -o /tmp/crafton-nginx-body.txt || true
              fi
              head -c 160 /tmp/crafton-nginx-body.txt 2>/dev/null || true
              echo
            done
            echo "=== docker edge proxy ==="
            if command -v docker >/dev/null 2>&1; then
              docker ps --format "table {{.ID}}\t{{.Names}}\t{{.Image}}\t{{.Ports}}"
              edge_id="$(docker ps --filter publish=80 --format "{{.ID}}" | head -n 1)"
              if [ -n "$edge_id" ]; then
                echo "-- edge container $edge_id"
                docker inspect --format "name={{.Name}} image={{.Config.Image}} labels={{json .Config.Labels}} mounts={{json .Mounts}} networks={{json .NetworkSettings.Networks}}" "$edge_id" || true
              fi
              echo "-- container routing labels and networks"
              for container_id in $(docker ps -q); do
                docker inspect --format "name={{.Name}} labels={{json .Config.Labels}} networks={{json .NetworkSettings.Networks}}" "$container_id" || true
              done
              echo "-- Traefik entrypoints and providers"
              grep -E "^\[|address|endpoint|exposedByDefault|watch|directory" /opt/hostedapps/traefik.toml 2>/dev/null || true
              echo "-- Traefik compose routing configuration"
              grep -E "^[[:space:]]*(services:|traefik:|networks:|- .*:|- --|ports:|labels:|command:|image:)" /opt/hostedapps/docker-compose.traefik.yaml 2>/dev/null || true
              echo "-- candidate proxy configuration"
              find /etc /opt /var/lib/docker/volumes -maxdepth 6 -type f \( -iname "*traefik*.yml" -o -iname "*traefik*.yaml" -o -iname "Caddyfile" -o -iname "*dynamic*.yml" -o -iname "*dynamic*.yaml" \) 2>/dev/null | head -n 100
            fi
            echo "=== web configuration ==="
            if command -v nginx >/dev/null 2>&1; then
              nginx -T 2>/dev/null | grep -E "^[[:space:]]*(listen|server_name|root|proxy_pass|try_files)" | head -n 120 || true
            fi
            if command -v caddy >/dev/null 2>&1; then
              caddy adapt --config /etc/caddy/Caddyfile --pretty 2>/dev/null | grep -E "listen|host|root|reverse_proxy" | head -n 120 || true
            fi
          '
